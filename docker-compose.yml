# Production-like stack: PostgreSQL + API + web (nginx). Usage:
#   cp server/.env.example .env   # fill in values (DATABASE_URL is set below)
#   docker compose up --build     # app on http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aiquest
      POSTGRES_USER: aiquest
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiquest -d aiquest"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: ./server
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://aiquest:${POSTGRES_PASSWORD:-change-me}@db:5432/aiquest
      AI_QUEST_CORS_ORIGINS: ${AI_QUEST_PUBLIC_URL:-http://localhost:8080}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
